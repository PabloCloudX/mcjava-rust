name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --verbose
      - run: cargo build --locked
      - run: python3 -c "import ctypes; assert ctypes.CDLL('./target/debug/libminecraft_rust.so').minecraft_rust_protocol_version() == 777"
      - run: python3 tests/protocol_smoke.py ./target/debug/minecraft-rust
      - run: python3 tests/protocol_smoke.py ./target/debug/minecraft-rust
        env:
          MC_OFFLINE_MODE: "1"
