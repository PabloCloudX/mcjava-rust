name: Build
on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'src/**', 'docs/**', 'README.md', 'scripts/**', '.github/workflows/build.yml']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: minecraft-rust-26.3-linux-x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/minecraft-rust
          if-no-files-found: error
          retention-days: 14
      - if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ matrix.artifact }}
          ASSET_PATH: target/${{ matrix.target }}/release/minecraft-rust
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$ASSET_PATH#$ASSET_NAME" --clobber
